{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="bdh-hub-origin" content="{{ hub_origin }}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ hub_nav_title|default:hub_brand.name }}{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="{% static 'bdh/base.css' %}">
    <link rel="stylesheet" href="{% static 'bdh/scrollhint.css' %}">
    <style>
        /* In the hub's iframe: the hub draws the navbar, the app only its content. */
        body { padding-top: 0; }
        .content-wrapper { margin-top: 0; }
        .bdh-toolbar { display: flex; justify-content: flex-end; align-items: center; gap: .5rem;
                       padding: .35rem .75rem; background: #212529; }
        .bdh-toolbar:empty { display: none; }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="in-hub-frame {% block body_class %}{% endblock %}">
    <template id="bdh-title">{% block navbar_title %}{{ hub_nav_title }}{% endblock %}</template>
    <div class="bdh-toolbar navbar-dark">{% block navbar_extras %}{% endblock %}</div>

    <div class="container-fluid content-wrapper">
        {% block content %}{% endblock %}
    </div>

    <script src="{% static 'bdh/chimes.js' %}"></script>
    <link rel="stylesheet" href="{% static 'bdh/keyboard.css' %}">
    <script src="{% static 'bdh/keyboard.js' %}"></script>
    <script src="{% static 'bdh/scrollhint.js' %}"></script>
    <script src="{% static 'bdh/embed.js' %}"></script>
</body>
</html>
