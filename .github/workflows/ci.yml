name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: |
          python -m pip install -e ".[ha,qr,qr-test,runtime]" packaging
          python -m unittest discover -s tests -v

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  stack-e2e:
    # This SDK installed into the app runtime and building the apps, with the
    # hub and supervisor pinned by the hub's tests/e2e/stack.lock.json.
    uses: blackdiamondhub/BlackDiamondHub/.github/workflows/stack-e2e.yml@dba0a26f7c2f458a22c1a601fc8646e396a19b6d
    with:
      sdk_repo: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      sdk_ref: ${{ github.event.pull_request.head.sha || github.sha }}
      sdk_in_runtime: true
