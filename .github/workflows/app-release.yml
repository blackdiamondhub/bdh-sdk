name: Hub app release

# Reusable release workflow for hub app repos. The first time a version in
# pyproject.toml lands on main it tags v<version> and publishes a GitHub
# release with what the platform needs to build the app's image:
#
#   - the wheel (and sdist)
#   - bdh-lock.txt: the app's third-party dependencies, hash-locked against
#     the current bdh-app-runtime base (only what the base doesn't provide)
#   - bdh-app.json: [tool.bdh] build config (apt, pip_exclude, custom_base)
#     and the app's manifest as its image reports it
#   - bdh-extra.Dockerfile: only for custom_base apps
#
# Before publishing it builds the image from these files with bdh-sdk's
# builder and smoke-tests it, and it attests every asset's build provenance.
# App repos build no images and push nothing else: the central builder in
# blackdiamondlodge/bdh-app-catalog verifies the attestations, builds,
# smoke-tests, pushes and attests ghcr.io/blackdiamondlodge/bdh-app-<id>, and
# opens the catalog PR (see bdh-sdk builder/README.md).
#
#   on:
#     push:
#       branches: [main]
#   jobs:
#     release:
#       uses: blackdiamondlodge/bdh-sdk/.github/workflows/app-release.yml@v0
#       permissions:
#         contents: write
#         id-token: write      # build provenance attestation (required)
#         attestations: write

on:
  workflow_call:
    inputs:
      sdk_ref:
        description: Git ref of blackdiamondlodge/bdh-sdk whose builder to use.
        required: false
        type: string
        default: v0
      hub_api:
        description: Hub API (bdh-app-runtime:hub-api-<N>) the app targets.
        required: false
        type: number
        default: 2
      smoke_env:
        description: Extra environment for the smoke test, one KEY=VALUE per line.
        required: false
        type: string
        default: ""
      smoke_settle:
        description: Seconds the smoke test lets background workers run before measuring memory.
        required: false
        type: number
        default: 5
    outputs:
      released:
        description: "true when a new release was published"
        value: ${{ jobs.release.outputs.released }}
      tag:
        value: ${{ jobs.release.outputs.tag }}

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    outputs:
      released: ${{ steps.publish.outputs.released || 'false' }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: blackdiamondlodge/bdh-sdk
          ref: ${{ inputs.sdk_ref }}
          path: .bdh-sdk

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read version
        id: version
        run: |
          set -euo pipefail
          python -m pip install --quiet packaging
          read -r name version < <(python -c "import tomllib; p=tomllib.load(open('pyproject.toml','rb'))['project']; print(p['name'], p['version'])")
          # PEP 440 pre-releases (2.3.0b1, 2.3.0rc1, 2.3.0a1) are betas: they are
          # published as GitHub pre-releases and land in the catalog's beta channel.
          info=$(python .bdh-sdk/builder/release_version.py "$version")
          tag=$(sed -n 's/^tag=//p' <<<"$info")
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "$info" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "Tag ${tag} already exists; nothing to release."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the wheel
        if: steps.version.outputs.exists == 'false'
        run: |
          python -m pip install --upgrade pip build
          python -m build --outdir dist

      - name: Lock, build and smoke-test the image
        if: steps.version.outputs.exists == 'false'
        env:
          HUB_API: ${{ inputs.hub_api }}
          SMOKE_ENV: ${{ inputs.smoke_env }}
          SMOKE_SETTLE: ${{ inputs.smoke_settle }}
        run: |
          set -euo pipefail
          printf '%s\n' "$SMOKE_ENV" | sed '/^[[:space:]]*$/d' > "$RUNNER_TEMP/smoke.env"
          SMOKE_ENV_FILE="$RUNNER_TEMP/smoke.env" bash .bdh-sdk/builder/app_artifacts.sh \
            dist/*.whl pyproject.toml release
          cp dist/*.tar.gz release/
          {
            echo "### Image smoke test"
            echo '```json'
            cat release/smoke.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attest build provenance
        if: steps.version.outputs.exists == 'false'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release/*.whl
            release/*.tar.gz
            release/bdh-*

      - name: Tag and create release
        id: publish
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.version.outputs.name }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "${NAME} ${VERSION}"
          git push origin "refs/tags/$TAG"

          {
            echo "${NAME} ${VERSION}"
            echo
            git log -1 --format=%s
            echo
            echo "The platform builds ghcr.io/blackdiamondlodge/bdh-app-<id> from these assets"
            echo "and adds it to the app catalog."
            echo
            echo "Smoke test of the image built from them:"
            echo
            echo '```json'
            cat release/smoke.json
            echo '```'
          } > release-notes.md

          assets=(release/*.whl release/*.tar.gz release/bdh-app.json release/bdh-lock.txt)
          [ ! -f release/bdh-extra.Dockerfile ] || assets+=(release/bdh-extra.Dockerfile)
          flags=()
          [ "$PRERELEASE" != "true" ] || flags+=(--prerelease)
          gh release create "$TAG" "${assets[@]}" "${flags[@]}" \
            --title "${NAME} ${VERSION}" \
            --notes-file release-notes.md \
            --verify-tag
          echo "released=true" >> "$GITHUB_OUTPUT"
