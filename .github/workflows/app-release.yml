name: Hub app release

# Reusable release workflow for hub app repos. The first time a version in
# pyproject.toml lands on main it tags v<version>, builds the wheel and
# publishes a GitHub release whose notes include the ready-to-paste line for
# the hub's sites/<site>/apps.txt. It then attests the wheel's build
# provenance and opens an auto-merging PR adding the version to
# blackdiamondlodge/bdh-app-catalog.
#
#   on:
#     push:
#       branches: [main]
#   jobs:
#     release:
#       uses: blackdiamondlodge/bdh-sdk/.github/workflows/app-release.yml@v0
#       permissions:
#         contents: write
#         id-token: write      # build provenance attestation
#         attestations: write
#       secrets: inherit       # CATALOG_TOKEN
#
# Both extras are optional: without id-token/attestations the wheel isn't
# attested, and without CATALOG_TOKEN the catalog PR is skipped. Each logs a
# warning and the release still succeeds.

on:
  workflow_call:
    secrets:
      CATALOG_TOKEN:
        description: >-
          Token that can push branches and open PRs on
          blackdiamondlodge/bdh-app-catalog (contents + pull requests write).
        required: false
    outputs:
      released:
        description: "true when a new release was published"
        value: ${{ jobs.release.outputs.released }}
      tag:
        value: ${{ jobs.release.outputs.tag }}
      requirement:
        description: The apps.txt line (URL + hash) for the new wheel.
        value: ${{ jobs.release.outputs.requirement }}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    outputs:
      released: ${{ steps.publish.outputs.released || 'false' }}
      tag: ${{ steps.version.outputs.tag }}
      requirement: ${{ steps.publish.outputs.requirement }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read version
        id: version
        run: |
          read -r name version < <(python -c "import tomllib; p=tomllib.load(open('pyproject.toml','rb'))['project']; print(p['name'], p['version'])")
          tag="v${version}"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "Tag ${tag} already exists; nothing to release."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.version.outputs.exists == 'false'
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Tag and create release
        id: publish
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.version.outputs.name }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          wheel=$(ls dist/*.whl)
          sdist=$(ls dist/*.tar.gz)
          sha=$(sha256sum "$wheel" | cut -d' ' -f1)
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/$(basename "$wheel")"
          requirement="${NAME} @ ${url} --hash=sha256:${sha}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "${NAME} ${VERSION}"
          git push origin "refs/tags/$TAG"

          {
            echo "${NAME} ${VERSION}"
            echo
            echo "Line for the hub's \`sites/<site>/apps.txt\`:"
            echo
            echo '```'
            echo "$requirement"
            echo '```'
          } > release-notes.md

          gh release create "$TAG" "$wheel" "$sdist" \
            --title "${NAME} ${VERSION}" \
            --notes-file release-notes.md \
            --verify-tag

          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "requirement=${requirement}" >> "$GITHUB_OUTPUT"
      # The job can only mint an OIDC token when the caller grants
      # id-token: write; requesting it here would fail every caller that
      # doesn't, so detect it instead.
      - name: Check attestation permissions
        id: oidc
        if: steps.publish.outputs.released == 'true'
        run: |
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Wheel not attested: grant 'id-token: write' and 'attestations: write' to the app-release job."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Attest build provenance
        id: attest
        if: steps.oidc.outputs.available == 'true'
        continue-on-error: true
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.whl

      - name: Add to the app catalog
        if: steps.publish.outputs.released == 'true'
        env:
          CATALOG_TOKEN: ${{ secrets.CATALOG_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
        run: |
          set -euo pipefail
          if [ -z "${CATALOG_TOKEN}" ]; then
            echo "::warning::CATALOG_TOKEN not available; ${TAG} was not added to blackdiamondlodge/bdh-app-catalog. Pass it with 'secrets: inherit', or run scripts/sync_releases.py there."
            exit 0
          fi
          changelog=$(git log -1 --format=%s)
          wheel=$(ls "$PWD"/dist/*.whl)
          git clone -q "https://x-access-token:${CATALOG_TOKEN}@github.com/blackdiamondlodge/bdh-app-catalog.git" "$RUNNER_TEMP/catalog"
          cd "$RUNNER_TEMP/catalog"

          args=(--wheel "$wheel" --repo "$GITHUB_REPOSITORY" --tag "$TAG"
                --changelog "$changelog" --github-output "$RUNNER_TEMP/catalog.out")
          if [ -n "${ATTESTATION_URL}" ]; then
            args+=(--attestation-url "$ATTESTATION_URL")
          fi
          python scripts/add_version.py "${args[@]}"
          app_id=$(sed -n 's/^app_id=//p' "$RUNNER_TEMP/catalog.out")
          version=$(sed -n 's/^version=//p' "$RUNNER_TEMP/catalog.out")
          branch="add/${app_id}-${version}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b "$branch"
          git commit -q -am "Add ${app_id} ${version}"
          git push -q --force origin "$branch"

          export GH_TOKEN="$CATALOG_TOKEN"
          repo=blackdiamondlodge/bdh-app-catalog
          if ! gh pr view "$branch" --repo "$repo" --json number >/dev/null 2>&1; then
            gh pr create --repo "$repo" --base main --head "$branch" \
              --title "Add ${app_id} ${version}" \
              --body "Released by ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}: ${changelog}"
          fi
          gh pr merge "$branch" --repo "$repo" --squash --auto --delete-branch
